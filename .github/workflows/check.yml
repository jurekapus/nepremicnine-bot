name: Check for new apartments

on:
  schedule:
    # Runs every 20 minutes. GitHub may delay this a few minutes under load.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: debug/
          retention-days: 3

      - name: Commit updated listings
        run: |
          git config user.name "apartment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/listings.json docs/listings.json
          git diff --cached --quiet || git commit -m "Update listings [skip ci]"
          git push
